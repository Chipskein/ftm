[project]
name = "FTM"
version = "0.0.1"
description = "FTM"
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "opencv-python",
    "numpy",
    "Pillow",
    "psutil",
    "manga-ocr",
    "pandas",
    "ollama",
    "ultralytics",
]

[project.optional-dependencies]
nvidia = [
    "nvidia-ml-py",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"src" = ["assets/models/*.pt", "assets/fonts/*.ttf", "assets/fonts/*.otf"]

[project.scripts]
ftm = "src.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
